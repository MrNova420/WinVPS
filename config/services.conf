# WinVPS Service Definitions — v2.0
# Format: name|script|type|port|auto_start|health_check|depends_on|description
# Type: ps|cmd|node|python|go|dotnet|docker|custom
# Port: listening port (0 = no port)
# Auto-start: true|false
# Health check: HTTP URL or TCP port (empty = no check)
# Depends on: comma-separated service names (empty = no dependencies)
#
# Examples:
# myapp|D:\projects\app\server.js|node|3000|true|http://localhost:3000/health||My web application
# api|D:\projects\api\main.py|python|8000|true|http://localhost:8000/docs|redis,postgres|REST API

# --- Core WinVPS Services ---
ssh|src/core/ssh.ps1|ps|7022|true|||OpenSSH server
web|src/core/httpd.ps1|ps|7080|true|||Web dashboard
fail2ban|src/core/fail2ban.ps1|ps|0|false|||Brute-force protection
