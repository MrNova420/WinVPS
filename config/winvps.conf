# WinVPS Main Configuration — v1.0.0
# Auto-detected on install, edit to customize

# --- Tier ---
WINVPS_TIER="auto"
WINVPS_VERSION="1.0.0"
WINVPS_DIR="C:\WinVPS"
WINVPS_HOSTNAME="winvps-device"

# --- Ports ---
WINVPS_PORT_BASE=7000
WINVPS_SSH_PORT=7022
WINVPS_WEB_PORT=7080
WINVPS_HTTPS_PORT=7443
WINVPS_FILE_PORT=7444
WINVPS_VPN_PORT=7518
WINVPS_DB_PORT=7306
WINVPS_CODE_PORT=7443

# --- SSH ---
WINVPS_SSH_TYPE="auto"

# --- HTTPD ---
WINVPS_HTTPD_TYPE="auto"

# --- Monitoring ---
WINVPS_MONITORING="auto"

# --- Updates ---
WINVPS_AUTO_UPDATE=true
WINVPS_UPDATE_INTERVAL="weekly"
WINVPS_AUTO_BACKUP=true
WINVPS_BACKUP_INTERVAL="weekly"
WINVPS_BACKUP_RETENTION=5

# --- Logging ---
WINVPS_LOG_LEVEL="info"
WINVPS_LOG_RETENTION_DAYS=30

# --- Watchdog ---
WINVPS_WATCHDOG=true
WINVPS_WATCHDOG_INTERVAL=30
WINVPS_MONITOR_INTERVAL=30

# --- Tunnels ---
WINVPS_TUNNEL_TYPE="cloudflare"
WINVPS_TUNNEL_TOKEN=""
WINVPS_NGROK_TOKEN=""
WINVPS_TAILSCALE_HOSTNAME=""

# --- Bots ---
WINVPS_TELEGRAM_BOT_TOKEN=""
WINVPS_TELEGRAM_CHAT_ID=""
WINVPS_DISCORD_BOT_TOKEN=""
WINVPS_DISCORD_CHANNEL_ID=""

# --- Web UI ---
# WINVPS_WEB_HOST: bind address (127.0.0.1 = localhost only, 0.0.0.0 = all interfaces)
WINVPS_WEB_HOST="127.0.0.1"
WINVPS_WEB_PASSWORD="winvps_admin"
WINVPS_WEB_API_KEY=""
WINVPS_WEB_SSL=false

# --- Security ---
WINVPS_STEALTH=false
WINVPS_STEALTH_START_HOUR=0
WINVPS_STEALTH_END_HOUR=24
WINVPS_OBFUSCATE=false
WINVPS_ENCRYPT_STORAGE=false
WINVPS_ENCRYPT_PASSWORD=""
WINVPS_TAMPER_DETECTION=true
WINVPS_TAMPER_MAX_FAILED=10
WINVPS_DEAD_MAN_DAYS=30
WINVPS_VPN_KILLSWITCH=false
WINVPS_VPN_IFACE="WireGuard"
WINVPS_TOR_ENABLED=false

# --- Misc ---
WINVPS_TIMEZONE="UTC"
